name: CI — Spec Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Lint & Typecheck ────────────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck

  # ── API Cucumber Tests ──────────────────────────────────────
  test-api:
    name: API Tests (Cucumber + Supertest)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_sdlc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_sdlc_test
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
      AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
      API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ai-sdlc/api run db:migrate
      - run: pnpm --filter @ai-sdlc/api run build
      - name: Start API
        run: pnpm --filter @ai-sdlc/api start &
      - run: |
          npx wait-on http://localhost:4000/health --timeout 30000
      - run: |
          npx cucumber-js --profile api --config e2e/cucumber.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-cucumber-report
          path: cucumber-report/

  # ── E2E Admin Tests ─────────────────────────────────────────
  test-e2e-admin:
    name: E2E Tests — Admin Portal
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @ai-sdlc/admin-portal run build
      - name: Start Admin Portal preview
        run: pnpm --filter @ai-sdlc/admin-portal preview --port 3000 &
      - run: npx wait-on http://localhost:3000 --timeout 30000
      - run: |
          ADMIN_URL=http://localhost:3000 \
          npx cucumber-js --profile e2e:admin --config e2e/cucumber.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-e2e-report
          path: cucumber-report/

  # ── E2E Member Tests ─────────────────────────────────────────
  test-e2e-member:
    name: E2E Tests — Member Portal
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @ai-sdlc/member-portal run build
      - name: Start Member Portal preview
        run: pnpm --filter @ai-sdlc/member-portal preview --port 3001 &
      - run: npx wait-on http://localhost:3001 --timeout 30000
      - run: |
          MEMBER_URL=http://localhost:3001 \
          npx cucumber-js --profile e2e:member --config e2e/cucumber.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: member-e2e-report
          path: cucumber-report/
