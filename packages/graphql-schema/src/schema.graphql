directive @auth(
  action: String!
  object: String!
) on FIELD_DEFINITION | OBJECT

type Query {
  me: User
  users: [User!]! @auth(action: "read", object: "/users/*")
}

type Mutation {
  # Auth mutations are handled by Auth0; this is for profile/app-level mutations
  updateProfile(input: UpdateProfileInput!): User!
}

type User {
  id: ID!
  email: String!
  name: String
  role: UserRole!
  createdAt: String!
  updatedAt: String!
}

enum UserRole {
  ADMIN
  MEMBER
}

input UpdateProfileInput {
  name: String
}
